name: Nodivra Runtime
version: "0.10.0"
slug: nodivra_runtime
description: Gemeinsame Runtime für Nodivra Automationen und eigene Dashboards.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_entry: ""
panel_admin: true
panel_title: Nodivra Automationen
panel_icon: mdi:graph-outline
ports:
  8668/tcp: 8668
ports_description:
  8668/tcp: Lokale Nodivra-API (Zugangsschlüssel erforderlich)
watchdog: http://[HOST]:[PORT:8668]/health
options:
  access_key: ""
schema:
  access_key: password
